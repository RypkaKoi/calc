<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>"Эвм"</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="calculator">
    
         <!-- Дисплей калькулятора  -->
        <div class="display" id="display">0</div>
        
        <!-- Тыкалки -->
        <div class="buttons">
            <button class="but" data-key="7">7</button>
            <button class="but" data-key="8">8</button>
            <button class="but" data-key="9">9</button>
            <button class="but operator" data-key="/">÷</button>

            <button class="but" data-key="4">4</button>
            <button class="but" data-key="5">5</button>
            <button class="but" data-key="6">6</button>
            <button class="but operator" data-key="*">x</button>

            <button class="but" data-key="1">1</button>
            <button class="but" data-key="2">2</button>
            <button class="but" data-key="3">3</button>
            <button class="but operator" data-key="-">-</button>

            <button class="but clear" data-key="c">AC</button>
            <button class="but" data-key=".">.</button>
            <button class="but equals" data-key="+">+</button>
            <button class="but operator" data-key="=">=</button>
        </div>
    </div>

    <script src="scripts.js"></script>
</body>
</html>
